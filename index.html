<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特別教室予約システム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel (JSXコンパイル用) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #f8fafc; font-family: sans-serif; }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDK (v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, where, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ご提示いただいたFirebase設定
        const firebaseConfig = {
            apiKey: "AIzaSyBtD733htI7ZheL2CRkIPDxXYd5jGKJQ2A",
            authDomain: "yoyaku-36bbd.firebaseapp.com",
            projectId: "yoyaku-36bbd",
            storageBucket: "yoyaku-36bbd.firebasestorage.app",
            messagingSenderId: "254538818540",
            appId: "1:254538818540:web:51411c25d3b66e562c16c9",
            measurementId: "G-FTZFV90DYF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Reactコンポーネント側にFirebase参照を渡す
        window.db = db;
        window.auth = auth;
        window.firestoreTools = { collection, addDoc, deleteDoc, doc, onSnapshot, query, where, getDocs, writeBatch, signInAnonymously, onAuthStateChanged };
    </script>

    <!-- React アプリケーション メインスクリプト -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // 修正後の特別教室リスト（全19施設）
        const ROOMS = [
            { id: 'pool', name: 'プール' },
            { id: 'taiiku', name: '体育館' },
            { id: 'houl', name: '小中玄関ホール' },
            { id: 'jikatu1', name: '自立活動室（大）' },
            { id: 'soudan', name: '教育相談室' },
            { id: 'jikatu2', name: '自立活動室（厨房横）' },
            { id: 'sithoukaku', name: '視聴覚室' },
            { id: 'kaigisitumae', name: '会議室前' },
            { id: 'kaigisituusiro', name: '会議室後' },
            { id: 'music', name: '小中音楽室' },
            { id: 'pc', name: 'パソコンコーナー' },
            { id: 'katei', name: '家庭科室（中）' },
            { id: 'rika', name: '理科室（中）' },
            { id: 'tosyo', name: '図書室' },
            { id: 'music2', name: '音楽室（高）' },
            { id: 'jikatu3', name: '自立活動室（高）' },
            { id: 'kateikou', name: '家庭科室（高）' },
            { id: 'sagyou', name: '作業室（高）' },
            { id: 'soudansitu', name: '相談室（高）' }
        ];

        // 9:00 〜 17:00 の30分刻みタイムスロット
        const TIME_SLOTS = [];
        for (let h = 9; h < 17; h++) {
            TIME_SLOTS.push(`${String(h).padStart(2, '0')}:00`);
            TIME_SLOTS.push(`${String(h).padStart(2, '0')}:30`);
        }

        function App() {
            const [selectedRoom, setSelectedRoom] = useState(ROOMS[0].id);
            const [currentWeekStart, setCurrentWeekStart] = useState(getMonday(new Date()));
            const [reservations, setReservations] = useState([]);
            const [user, setUser] = useState(null);
            
            // 予約モーダル状態
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedSlot, setSelectedSlot] = useState(null);
            
            // 入力項目
            const [purpose, setPurpose] = useState('');
            const [department, setDepartment] = useState(localStorage.getItem('user_department') || '');
            const [userName, setUserName] = useState(localStorage.getItem('user_name') || '');
            const [isRecurring, setIsRecurring] = useState(false);
            const [repeatWeeks, setRepeatWeeks] = useState(4);
            const [selectedReservation, setSelectedReservation] = useState(null);

            // 認証初期化
            useEffect(() => {
                const { signInAnonymously, onAuthStateChanged } = window.firestoreTools;
                signInAnonymously(window.auth).catch(console.error);
                const unsubscribe = onAuthStateChanged(window.auth, (u) => setUser(u));
                return () => unsubscribe();
            }, []);

            // 予約データのリアルタイム取得
            useEffect(() => {
                const { collection, onSnapshot, query, where } = window.firestoreTools;
                const q = query(collection(window.db, "reservations"), where("roomId", "==", selectedRoom));
                
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setReservations(data);
                });
                return () => unsubscribe();
            }, [selectedRoom]);

            // 週移動
            function handlePrevWeek() {
                const d = new Date(currentWeekStart);
                d.setDate(d.getDate() - 7);
                setCurrentWeekStart(d);
            }

            function handleNextWeek() {
                const d = new Date(currentWeekStart);
                d.setDate(d.getDate() + 7);
                setCurrentWeekStart(d);
            }

            function handleToday() {
                setCurrentWeekStart(getMonday(new Date()));
            }

            // 週の日付配列取得 (月〜金)
            const weekDays = [0, 1, 2, 3, 4].map(i => {
                const d = new Date(currentWeekStart);
                d.setDate(d.getDate() + i);
                return d;
            });

            // スロットクリック処理
            function handleSlotClick(dateStr, timeStr, existingRes) {
                if (existingRes) {
                    setSelectedReservation(existingRes);
                    return;
                }
                setSelectedSlot({ dateStr, timeStr });
                setPurpose('');
                setIsRecurring(false);
                setSelectedReservation(null);
                setIsModalOpen(true);
            }

            // 予約作成処理
            async function handleCreateReservation(e) {
                e.preventDefault();
                if (!purpose || !userName || !department) {
                    alert('すべての必須項目を入力してください。');
                    return;
                }

                // 入力内容をブラウザに記憶
                localStorage.setItem('user_department', department);
                localStorage.setItem('user_name', userName);

                const { collection, addDoc, writeBatch, doc } = window.firestoreTools;

                try {
                    if (isRecurring) {
                        // 毎週繰り返し予約
                        const batch = writeBatch(window.db);
                        const baseDate = new Date(selectedSlot.dateStr);

                        for (let i = 0; i < repeatWeeks; i++) {
                            const targetDate = new Date(baseDate);
                            targetDate.setDate(targetDate.getDate() + (i * 7));
                            const dateStr = formatDate(targetDate);

                            const newDocRef = doc(collection(window.db, "reservations"));
                            batch.set(newDocRef, {
                                roomId: selectedRoom,
                                date: dateStr,
                                time: selectedSlot.timeStr,
                                purpose,
                                department,
                                userName,
                                userId: user ? user.uid : 'anonymous',
                                createdAt: new Date().toISOString()
                            });
                        }
                        await batch.commit();
                    } else {
                        // スポット予約
                        await addDoc(collection(window.db, "reservations"), {
                            roomId: selectedRoom,
                            date: selectedSlot.dateStr,
                            time: selectedSlot.timeStr,
                            purpose,
                            department,
                            userName,
                            userId: user ? user.uid : 'anonymous',
                            createdAt: new Date().toISOString()
                        });
                    }

                    setIsModalOpen(false);
                } catch (err) {
                    console.error("予約エラー:", err);
                    alert("予約の作成に失敗しました。");
                }
            }

            // 予約削除処理
            async function handleDeleteReservation(resId) {
                if (!confirm("この予約をキャンセルしてもよろしいですか？")) return;
                const { deleteDoc, doc } = window.firestoreTools;
                try {
                    await deleteDoc(doc(window.db, "reservations", resId));
                    setSelectedReservation(null);
                } catch (err) {
                    console.error("削除エラー:", err);
                    alert("予約の削除に失敗しました。");
                }
            }

            const currentRoomObj = ROOMS.find(r => r.id === selectedRoom);

            return (
                <div className="max-w-7xl mx-auto p-3 sm:p-6">
                    {/* ヘッダー */}
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h1 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                🏫 特別教室予約システム
                            </h1>
                            <p className="text-xs text-slate-500 mt-1">施設を選択して30分単位で予約が可能です</p>
                        </div>

                        {/* 教室選択ドロップダウン */}
                        <div className="flex items-center gap-2">
                            <label className="text-sm font-semibold text-slate-700 whitespace-nowrap">対象施設:</label>
                            <select 
                                value={selectedRoom} 
                                onChange={e => setSelectedRoom(e.target.value)}
                                className="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 font-bold"
                            >
                                {ROOMS.map(room => (
                                    <option key={room.id} value={room.id}>{room.name}</option>
                                ))}
                            </select>
                        </div>
                    </div>

                    {/* ナビゲーションバー (前週・今週・次週) */}
                    <div className="bg-white rounded-t-xl border border-slate-200 p-3 flex items-center justify-between border-b-0">
                        <div className="flex items-center gap-2">
                            <button onClick={handlePrevWeek} className="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition">← 前週</button>
                            <button onClick={handleToday} className="px-3 py-1.5 text-xs font-medium bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-md transition">今週</button>
                            <button onClick={handleNextWeek} className="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition">次週 →</button>
                        </div>
                        <div className="text-sm font-bold text-slate-700">
                            {formatDate(weekDays[0])} 〜 {formatDate(weekDays[4])}
                        </div>
                    </div>

                    {/* 週間カレンダーテーブル */}
                    <div className="bg-white rounded-b-xl border border-slate-200 shadow-sm overflow-x-auto">
                        <table className="w-full border-collapse min-w-[700px]">
                            <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-xs text-slate-600">
                                    <th className="p-2 border-r border-slate-200 w-16 text-center font-semibold">時間</th>
                                    {weekDays.map((d, i) => {
                                        const dateStr = formatDate(d);
                                        const isToday = formatDate(new Date()) === dateStr;
                                        const dayNames = ['月', '火', '水', '木', '金'];
                                        return (
                                            <th key={dateStr} className={`p-2 border-r border-slate-200 text-center font-semibold ${isToday ? 'bg-blue-50/70 text-blue-700' : ''}`}>
                                                <div>{d.getMonth() + 1}/{d.getDate()} ({dayNames[i]})</div>
                                            </th>
                                        );
                                    })}
                                </tr>
                            </thead>
                            <tbody>
                                {TIME_SLOTS.map(timeStr => (
                                    <tr key={timeStr} className="border-b border-slate-100 text-xs hover:bg-slate-50/50">
                                        <td className="p-1.5 border-r border-slate-200 text-center text-slate-500 font-mono bg-slate-50/30">
                                            {timeStr}
                                        </td>
                                        {weekDays.map(d => {
                                            const dateStr = formatDate(d);
                                            const res = reservations.find(r => r.date === dateStr && r.time === timeStr);

                                            return (
                                                <td 
                                                    key={dateStr} 
                                                    onClick={() => handleSlotClick(dateStr, timeStr, res)}
                                                    className={`p-1 border-r border-slate-200 h-12 cursor-pointer transition relative vertical-top ${
                                                        res 
                                                            ? 'bg-blue-100/80 hover:bg-blue-200/80 border-blue-200' 
                                                            : 'hover:bg-blue-50/40'
                                                    }`}
                                                >
                                                    {res ? (
                                                        <div className="h-full w-full p-1 rounded bg-white/80 border border-blue-300 flex flex-col justify-between text-left leading-tight shadow-2xs">
                                                            <div className="font-bold text-blue-900 truncate">{res.purpose}</div>
                                                            <div className="text-[10px] text-slate-600 truncate">
                                                                {res.department} · {res.userName}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="h-full w-full flex items-center justify-center opacity-0 hover:opacity-100 text-blue-500 font-bold">
                                                            +
                                                        </div>
                                                    )}
                                                </td>
                                            );
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {/* 予約作成モーダル */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-xl border border-slate-100">
                                <h2 className="text-lg font-bold text-slate-800 mb-1">特別教室の予約</h2>
                                <p className="text-xs text-slate-500 mb-4">
                                    【{currentRoomObj?.name}】 {selectedSlot?.dateStr} {selectedSlot?.timeStr}〜
                                </p>

                                <form onSubmit={handleCreateReservation} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">用途 <span className="text-red-500">*</span></label>
                                        <input 
                                            type="text" 
                                            placeholder="例：理科実験、学年集会 など"
                                            value={purpose}
                                            onChange={e => setPurpose(e.target.value)}
                                            className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                                            required
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">学部・分掌名 <span className="text-red-500">*</span></label>
                                            <input 
                                                type="text" 
                                                placeholder="例：中学部、総務部"
                                                value={department}
                                                onChange={e => setDepartment(e.target.value)}
                                                className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">氏名 <span className="text-red-500">*</span></label>
                                            <input 
                                                type="text" 
                                                placeholder="例：山田 太郎"
                                                value={userName}
                                                onChange={e => setUserName(e.target.value)}
                                                className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                                                required
                                            />
                                        </div>
                                    </div>

                                    {/* 繰り返し設定 */}
                                    <div className="p-3 bg-slate-50 rounded-lg border border-slate-200">
                                        <label className="flex items-center gap-2 cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                checked={isRecurring}
                                                onChange={e => setIsRecurring(e.target.checked)}
                                                className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500"
                                            />
                                            <span className="text-xs font-semibold text-slate-700">毎週同じ時間にまとめて一括予約する</span>
                                        </label>

                                        {isRecurring && (
                                            <div className="mt-3 flex items-center gap-2 pl-6">
                                                <span className="text-xs text-slate-600">本日に加え、</span>
                                                <select 
                                                    value={repeatWeeks} 
                                                    onChange={e => setRepeatWeeks(Number(e.target.value))}
                                                    className="text-xs border border-slate-300 rounded p-1 bg-white"
                                                >
                                                    {[2, 3, 4, 6, 8, 12].map(w => (
                                                        <option key={w} value={w}>{w} 週間分</option>
                                                    ))}
                                                </select>
                                                <span className="text-xs text-slate-600">連続で予約を取る</span>
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex items-center justify-end gap-2 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setIsModalOpen(false)}
                                            className="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition"
                                        >
                                            キャンセル
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-4 py-2 text-xs font-medium bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-sm transition"
                                        >
                                            予約を確定する
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 予約詳細・削除モーダル */}
                    {selectedReservation && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl max-w-sm w-full p-6 shadow-xl border border-slate-100">
                                <h2 className="text-base font-bold text-slate-800 mb-3 border-b border-slate-100 pb-2">予約内容の確認</h2>
                                
                                <div className="space-y-2 text-xs text-slate-700 mb-6">
                                    <div><span className="text-slate-400">日時：</span>{selectedReservation.date} {selectedReservation.time}〜</div>
                                    <div><span className="text-slate-400">施設：</span>{currentRoomObj?.name}</div>
                                    <div><span className="text-slate-400">用途：</span><span className="font-bold text-slate-900">{selectedReservation.purpose}</span></div>
                                    <div><span className="text-slate-400">所属：</span>{selectedReservation.department}</div>
                                    <div><span className="text-slate-400">氏名：</span>{selectedReservation.userName}</div>
                                </div>

                                <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                                    <button 
                                        type="button" 
                                        onClick={() => handleDeleteReservation(selectedReservation.id)}
                                        className="px-3 py-1.5 text-xs font-medium bg-red-50 hover:bg-red-100 text-red-600 rounded-lg transition"
                                    >
                                        予約を削除
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => setSelectedReservation(null)}
                                        className="px-4 py-2 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition"
                                    >
                                        閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ヘルパー関数: 月曜日の日付取得
        function getMonday(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        // ヘルパー関数: YYYY-MM-DD フォーマット
        function formatDate(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // レンダリング実行
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
