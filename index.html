<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特別教室予約システム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Babel for React JSX Compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #f8fafc; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'https://esm.sh/react@18';
        import { createRoot } from 'https://esm.sh/react-dom@18/client';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { 
          getAuth, 
          onAuthStateChanged, 
          signInAnonymously
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { 
          getFirestore, 
          collection, 
          doc, 
          setDoc, 
          onSnapshot, 
          deleteDoc,
          query
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { format, addDays, startOfWeek, isSameDay, addWeeks } from 'https://esm.sh/date-fns@2.30.0';

        const firebaseConfig = {
          apiKey: "AIzaSyBtD733htI7ZheL2CRkIPDxXYd5jGKJQ2A",
          authDomain: "yoyaku-36bbd.firebaseapp.com",
          projectId: "yoyaku-36bbd",
          storageBucket: "yoyaku-36bbd.firebasestorage.app",
          messagingSenderId: "254538818540",
          appId: "1:254538818540:web:51411c25d3b66e562c16c9",
          measurementId: "G-FTZFV90DYF"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'school-room-reservation';

        let app = null, auth = null, db = null;
        try {
          app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          db = getFirestore(app);
        } catch (e) {
          console.error("Firebase initialization failed:", e);
        }

        const ROOMS = [
          { id: 'science', name: '第1理科室' },
          { id: 'music', name: '音楽室' },
          { id: 'computer', name: 'PC教室' },
          { id: 'gym', name: '体育館' },
          { id: 'library', name: '図書室' }
        ];

        const TIME_SLOTS = [];
        for (let h = 9; h <= 16; h++) {
          TIME_SLOTS.push(`${h.toString().padStart(2, '0')}:00`);
          TIME_SLOTS.push(`${h.toString().padStart(2, '0')}:30`);
        }

        const DAYS_OF_WEEK = [1, 2, 3, 4, 5];

        const Icon = ({ children, className = "h-5 w-5", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            {children}
          </svg>
        );
        const Calendar = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></Icon>;
        const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></Icon>;
        const MapPin = (p) => <Icon {...p}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></Icon>;
        const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const Repeat = (p) => <Icon {...p}><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></Icon>;
        const User = (p) => <Icon {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></Icon>;
        const Users = (p) => <Icon {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></Icon>;
        const Briefcase = (p) => <Icon {...p}><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></Icon>;
        const BookOpen = (p) => <Icon {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></Icon>;
        const Trash = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></Icon>;

        const getWeekDays = (baseDate) => {
          const start = startOfWeek(baseDate, { weekStartsOn: 1 });
          return DAYS_OF_WEEK.map(offset => addDays(start, offset - 1));
        };

        const generateReservationId = (roomId, dateStr, timeSlot) => {
          return `${roomId}_${dateStr}_${timeSlot.replace(':', '')}`;
        };

        const ReservationApp = () => {
          const [user, setUser] = useState(null);
          const [authLoading, setAuthLoading] = useState(true);

          const [selectedRoom, setSelectedRoom] = useState(ROOMS[0].id);
          const [currentDate, setCurrentDate] = useState(new Date());
          const [reservations, setReservations] = useState({});
          const [loadingRooms, setLoadingRooms] = useState({});
          
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [selectedSlot, setSelectedSlot] = useState(null);
          const [existingRes, setExistingRes] = useState(null);
          
          const [purpose, setPurpose] = useState('');
          const [department, setDepartment] = useState('');
          const [reserverName, setReserverName] = useState('');
          
          const [isRecurring, setIsRecurring] = useState(false);
          const [recurringWeeks, setRecurringWeeks] = useState(4);
          const [isSubmitting, setIsSubmitting] = useState(false);
          const [errorMessage, setErrorMessage] = useState('');
          const [isDeleting, setIsDeleting] = useState(false);

          useEffect(() => {
            const savedDept = localStorage.getItem('school_res_dept') || '';
            const savedName = localStorage.getItem('school_res_name') || '';
            setDepartment(savedDept);
            setReserverName(savedName);
          }, []);

          useEffect(() => {
            if (!auth) {
              setAuthLoading(false);
              return;
            }

            const authenticate = async () => {
              try {
                await signInAnonymously(auth);
              } catch (err) {
                console.error("Firebase authentication error:", err);
              } finally {
                setAuthLoading(false);
              }
            };

            const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
              if (currentUser) {
                setUser(currentUser);
                setAuthLoading(false);
              } else {
                authenticate();
              }
            });

            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!auth || !db || !user) return;

            const reservationsRef = collection(db, 'artifacts', appId, 'public', 'data', 'reservations');
            setLoadingRooms(prev => ({ ...prev, [selectedRoom]: true }));

            const q = query(reservationsRef);
            const unsubscribe = onSnapshot(q, 
              (snapshot) => {
                const data = {};
                snapshot.forEach(doc => {
                  const res = doc.data();
                  if (res.roomId === selectedRoom) {
                    data[doc.id] = { ...res, id: doc.id };
                  }
                });
                setReservations(data);
                setLoadingRooms(prev => ({ ...prev, [selectedRoom]: false }));
              },
              (error) => {
                console.error("Error fetching Firestore reservations:", error);
                setLoadingRooms(prev => ({ ...prev, [selectedRoom]: false }));
              }
            );

            return () => unsubscribe();
          }, [user, selectedRoom]);

          const currentRoomName = useMemo(() => {
            return ROOMS.find(r => r.id === selectedRoom)?.name || '';
          }, [selectedRoom]);

          const weekDays = useMemo(() => getWeekDays(currentDate), [currentDate]);

          const handleSlotClick = (date, time) => {
            const dateStr = format(date, 'yyyy-MM-dd');
            const resId = generateReservationId(selectedRoom, dateStr, time);
            const res = reservations[resId];

            setSelectedSlot({ date, dateStr, time });
            setErrorMessage('');
            setIsDeleting(false);

            if (res) {
              setExistingRes(res);
              setIsModalOpen(true);
            } else {
              setExistingRes(null);
              setPurpose('');
              setIsRecurring(false);
              setIsModalOpen(true);
            }
          };

          const handleCreateReservation = async () => {
            if (!purpose.trim() || !reserverName.trim()) {
              setErrorMessage('用途と氏名は必須項目です。');
              return;
            }

            setIsSubmitting(true);
            setErrorMessage('');

            try {
              localStorage.setItem('school_res_dept', department);
              localStorage.setItem('school_res_name', reserverName);

              const datesToBook = [selectedSlot.date];
              if (isRecurring) {
                for (let i = 1; i < recurringWeeks; i++) {
                  datesToBook.push(addWeeks(selectedSlot.date, i));
                }
              }

              let hasConflict = false;
              const newReservations = [];

              for (const d of datesToBook) {
                const dStr = format(d, 'yyyy-MM-dd');
                const rId = generateReservationId(selectedRoom, dStr, selectedSlot.time);
                if (reservations[rId]) {
                  hasConflict = true;
                  break;
                }
                newReservations.push({
                  id: rId,
                  roomId: selectedRoom,
                  dateStr: dStr,
                  time: selectedSlot.time,
                  purpose: purpose,
                  department: department,
                  reserverName: reserverName,
                  title: purpose, 
                  userName: reserverName,
                  userId: user.uid,
                  createdAt: new Date().toISOString(),
                  isRecurring: isRecurring
                });
              }

              if (hasConflict) {
                setErrorMessage("選択した期間内に既に予約されている枠が含まれています。");
                setIsSubmitting(false);
                return;
              }

              for (const res of newReservations) {
                const resRef = doc(db, 'artifacts', appId, 'public', 'data', 'reservations', res.id);
                await setDoc(resRef, res);
              }

              closeModal();
            } catch (error) {
              console.error("Error creating reservation:", error);
              setErrorMessage("予約の保存に失敗しました。");
            } finally {
              setIsSubmitting(false);
            }
          };

          const handleDeleteReservation = async () => {
            if (!existingRes) return;
            setIsSubmitting(true);
            
            try {
              const resRef = doc(db, 'artifacts', appId, 'public', 'data', 'reservations', existingRes.id);
              await deleteDoc(resRef);
              closeModal();
            } catch (error) {
              console.error("Error deleting reservation:", error);
              setErrorMessage("削除に失敗しました。");
            } finally {
              setIsSubmitting(false);
            }
          };

          const closeModal = () => {
            setIsModalOpen(false);
            setSelectedSlot(null);
            setExistingRes(null);
            setIsDeleting(false);
          };

          const nextWeek = () => setCurrentDate(prev => addWeeks(prev, 1));
          const prevWeek = () => setCurrentDate(prev => addWeeks(prev, -1));
          const todayWeek = () => setCurrentDate(new Date());

          if (authLoading) {
            return (
              <div className="flex h-screen items-center justify-center bg-slate-50">
                <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col">
              <header className="bg-white border-b border-slate-200 px-4 py-3 sm:px-6 lg:px-8 flex justify-between items-center sticky top-0 z-10 shadow-sm">
                <div className="flex items-center space-x-2 text-indigo-700">
                  <Calendar className="h-6 w-6" />
                  <h1 className="text-xl font-bold tracking-tight">特別教室 予約システム</h1>
                </div>
                <div className="flex items-center space-x-4 text-sm">
                  <div className="hidden sm:flex items-center text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full">
                    <User className="h-4 w-4 mr-2" />
                    <span className="font-medium">
                      {reserverName ? `${reserverName} として操作中` : 'ログイン中'}
                    </span>
                  </div>
                </div>
              </header>

              <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                  <div className="w-full sm:w-auto flex items-center space-x-2">
                    <MapPin className="h-5 w-5 text-slate-400" />
                    <select
                      value={selectedRoom}
                      onChange={(e) => setSelectedRoom(e.target.value)}
                      className="block w-full sm:w-64 rounded-md border-0 py-2 pl-3 pr-10 text-slate-900 ring-1 ring-inset ring-slate-300 focus:ring-2 focus:ring-indigo-600 sm:text-sm sm:leading-6 bg-white cursor-pointer font-medium"
                    >
                      {ROOMS.map(room => (
                        <option key={room.id} value={room.id}>{room.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="flex items-center justify-between w-full sm:w-auto bg-slate-100 p-1 rounded-lg">
                    <button onClick={prevWeek} className="px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-white rounded-md transition-colors">前週</button>
                    <button onClick={todayWeek} className="px-4 py-1.5 text-sm font-bold text-indigo-700 hover:bg-white rounded-md transition-colors mx-1">今週</button>
                    <button onClick={nextWeek} className="px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-white rounded-md transition-colors">次週</button>
                  </div>
                </div>

                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold text-slate-800 flex items-center">
                    {currentRoomName} の予約状況
                    {loadingRooms[selectedRoom] && <span className="ml-3 text-sm font-normal text-slate-500 animate-pulse">更新中...</span>}
                  </h2>
                  <div className="text-sm font-medium text-slate-500 bg-white px-3 py-1 rounded-full shadow-sm border border-slate-100">
                    {format(weekDays[0], 'yyyy年MM月dd日')} - {format(weekDays[4], 'MM月dd日')}
                  </div>
                </div>

                {}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
                  <div className="overflow-x-auto">
                    <div className="min-w-[900px]">
                      <div className="grid grid-cols-6 border-b border-slate-200 bg-slate-50">
                        <div className="p-3 text-center border-r border-slate-200 flex items-center justify-center text-slate-400">
                          <Clock className="h-5 w-5" />
                        </div>
                        {weekDays.map(date => {
                          const isToday = isSameDay(date, new Date());
                          return (
                            <div key={date.toISOString()} className={`p-3 text-center border-r border-slate-200 last:border-r-0 ${isToday ? 'bg-indigo-50/50' : ''}`}>
                              <div className={`text-xs font-semibold uppercase tracking-wider mb-1 ${isToday ? 'text-indigo-600' : 'text-slate-500'}`}>
                                {['日', '月', '火', '水', '木', '金', '土'][date.getDay()]}
                              </div>
                              <div className={`text-lg font-bold ${isToday ? 'text-indigo-700' : 'text-slate-900'}`}>
                                {format(date, 'd')}
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      <div className="relative bg-white">
                        {TIME_SLOTS.map((time) => (
                          <div key={time} className="grid grid-cols-6 border-b border-slate-100 last:border-b-0 group">
                            <div className="p-2 text-center border-r border-slate-200 bg-slate-50 flex flex-col justify-start">
                              <span className="text-xs font-medium text-slate-500 -mt-2 bg-slate-50 px-1 inline-block">
                                {time}
                              </span>
                            </div>

                            {weekDays.map(date => {
                              const dateStr = format(date, 'yyyy-MM-dd');
                              const resId = generateReservationId(selectedRoom, dateStr, time);
                              const res = reservations[resId];
                              const isOwnRes = res && res.userId === user?.uid;

                              return (
                                <div 
                                  key={`${dateStr}-${time}`} 
                                  onClick={() => handleSlotClick(date, time)}
                                  className={`
                                    border-r border-slate-100 last:border-r-0 p-1 min-h-[70px] relative transition-colors cursor-pointer
                                    ${res 
                                      ? (isOwnRes ? 'bg-indigo-50 hover:bg-indigo-100' : 'bg-slate-100 hover:bg-slate-200') 
                                      : 'hover:bg-green-50'}
                                  `}
                                >
                                  {res ? (
                                    <div className={`
                                      h-full w-full rounded p-1.5 flex flex-col justify-between overflow-hidden shadow-sm border
                                      ${isOwnRes ? 'bg-indigo-100 border-indigo-200 text-indigo-900' : 'bg-white border-slate-200 text-slate-700 opacity-80'}
                                    `}>
                                      <div className="text-xs font-bold truncate leading-tight mb-0.5">
                                        {res.purpose || res.title}
                                      </div>
                                      <div className="flex justify-between items-end mt-auto pt-1 border-t border-black/5">
                                        <div className="text-[10px] flex flex-col truncate w-full">
                                          {res.department && (
                                            <span className="truncate opacity-70 mb-0.5">{res.department}</span>
                                          )}
                                          <span className="truncate font-medium">{res.reserverName || res.userName}</span>
                                        </div>
                                        {res.isRecurring && <Repeat className="h-3 w-3 opacity-60 flex-shrink-0 ml-1 mb-0.5" />}
                                      </div>
                                    </div>
                                  ) : (
                                    <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100">
                                      <Plus className="h-5 w-5 text-green-500" />
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </main>

              {}
              {isModalOpen && selectedSlot && (
                <div className="fixed inset-0 z-50 overflow-y-auto">
                  <div className="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                    <div className="fixed inset-0 transition-opacity" onClick={closeModal}>
                      <div className="absolute inset-0 bg-slate-900 opacity-50"></div>
                    </div>
                    <span className="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
                    <div className="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                      <div className="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                        <div className="sm:flex sm:items-start">
                          <div className="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-indigo-100 sm:mx-0 sm:h-10 sm:w-10">
                            <Calendar className="h-6 w-6 text-indigo-600" />
                          </div>
                          <div className="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 className="text-lg leading-6 font-bold text-slate-900 mb-1">
                              {existingRes ? '予約情報の確認' : '特別教室の予約'}
                            </h3>
                            
                            <div className="mt-2 text-sm text-slate-500 flex flex-col gap-1 mb-5 bg-slate-50 p-3 rounded-lg border border-slate-100">
                              <div className="flex items-center gap-2 font-medium text-slate-700">
                                <MapPin className="h-4 w-4" /> {currentRoomName}
                              </div>
                              <div className="flex items-center gap-2">
                                <Calendar className="h-4 w-4" /> {format(selectedSlot.date, 'yyyy年MM月dd日')} ({['日', '月', '火', '水', '木', '金', '土'][selectedSlot.date.getDay()]})
                              </div>
                              <div className="flex items-center gap-2 text-indigo-700 font-bold">
                                <Clock className="h-4 w-4" /> {selectedSlot.time} 〜 {(parseInt(selectedSlot.time.split(':')[0]) + (selectedSlot.time.includes('30') ? 1 : 0)).toString().padStart(2,'0')}:{selectedSlot.time.includes('30') ? '00' : '30'}
                              </div>
                            </div>

                            {errorMessage && (
                              <div className="mb-4 text-sm text-red-600 bg-red-50 p-2.5 rounded-lg border border-red-200">
                                {errorMessage}
                              </div>
                            )}

                            {existingRes ? (
                              <div className="space-y-3">
                                <div className="bg-slate-50 p-3.5 rounded-lg border border-slate-200 space-y-2 text-sm">
                                  <div>
                                    <span className="text-xs text-slate-500 block">用途</span>
                                    <span className="font-bold text-slate-800">{existingRes.purpose || existingRes.title}</span>
                                  </div>
                                  <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200">
                                    <div>
                                      <span className="text-xs text-slate-500 block">学部・分掌</span>
                                      <span className="font-medium text-slate-700">{existingRes.department || '未設定'}</span>
                                    </div>
                                    <div>
                                      <span className="text-xs text-slate-500 block">氏名</span>
                                      <span className="font-medium text-slate-700">{existingRes.reserverName || existingRes.userName}</span>
                                    </div>
                                  </div>
                                </div>

                                {existingRes.userId === user?.uid ? (
                                  isDeleting ? (
                                    <div className="p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700 flex flex-col gap-2">
                                      <span>この予約を取り消してもよろしいですか？</span>
                                      <div className="flex gap-2">
                                        <button 
                                          onClick={handleDeleteReservation}
                                          disabled={isSubmitting}
                                          className="px-3 py-1 bg-red-600 text-white font-bold rounded hover:bg-red-700 transition"
                                        >
                                          {isSubmitting ? '削除中...' : 'はい、削除します'}
                                        </button>
                                        <button 
                                          onClick={() => setIsDeleting(false)}
                                          className="px-3 py-1 bg-slate-200 text-slate-700 font-bold rounded hover:bg-slate-300 transition"
                                        >
                                          キャンセル
                                        </button>
                                      </div>
                                    </div>
                                  ) : (
                                    <button
                                      type="button"
                                      onClick={() => setIsDeleting(true)}
                                      className="w-full flex items-center justify-center gap-2 px-3 py-2 border border-red-300 text-red-600 rounded-lg text-sm font-medium hover:bg-red-50 transition"
                                    >
                                      <Trash className="h-4 w-4" /> この予約を取り消す
                                    </button>
                                  )
                                ) : (
                                  <p className="text-xs text-slate-400 italic">他のユーザーが作成した予約のため、取り消しできません。</p>
                                )}
                              </div>
                            ) : (
                              <div className="space-y-4">
                                <div>
                                  <label htmlFor="purpose" className="flex items-center text-sm font-medium text-slate-700 mb-1">
                                    <BookOpen className="h-4 w-4 mr-1 text-slate-400" /> 用途 <span className="ml-2 text-xs text-red-500">必須</span>
                                  </label>
                                  <input
                                    type="text"
                                    id="purpose"
                                    className="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-slate-300 rounded-md py-2 px-3 border"
                                    placeholder="例: 3年A組 理科実験"
                                    value={purpose}
                                    onChange={(e) => setPurpose(e.target.value)}
                                    autoFocus
                                  />
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                  <div>
                                    <label htmlFor="department" className="flex items-center text-sm font-medium text-slate-700 mb-1">
                                      <Briefcase className="h-4 w-4 mr-1 text-slate-400" /> 学部・分掌名
                                    </label>
                                    <input
                                      type="text"
                                      id="department"
                                      className="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-slate-300 rounded-md py-2 px-3 border"
                                      placeholder="例: 中学部、教務部"
                                      value={department}
                                      onChange={(e) => setDepartment(e.target.value)}
                                    />
                                  </div>

                                  <div>
                                    <label htmlFor="reserverName" className="flex items-center text-sm font-medium text-slate-700 mb-1">
                                      <Users className="h-4 w-4 mr-1 text-slate-400" /> 氏名 <span className="ml-2 text-xs text-red-500">必須</span>
                                    </label>
                                    <input
                                      type="text"
                                      id="reserverName"
                                      className="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-slate-300 rounded-md py-2 px-3 border"
                                      placeholder="例: 山田 太郎"
                                      value={reserverName}
                                      onChange={(e) => setReserverName(e.target.value)}
                                    />
                                  </div>
                                </div>
                                
                                <div className="pt-2 border-t border-slate-100">
                                  <div className="flex items-start mt-2">
                                    <div className="flex items-center h-5">
                                      <input
                                        id="recurring"
                                        type="checkbox"
                                        checked={isRecurring}
                                        onChange={(e) => setIsRecurring(e.target.checked)}
                                        className="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-slate-300 rounded"
                                      />
                                    </div>
                                    <div className="ml-3 text-sm">
                                      <label htmlFor="recurring" className="font-medium text-slate-700">毎週同じ時間に予約する</label>
                                      <p className="text-slate-500 text-xs mt-0.5">選択した期間、同じ曜日の同じ時間に一括予約します。</p>
                                    </div>
                                  </div>

                                  {isRecurring && (
                                    <div className="ml-7 mt-3 pl-3 border-l-2 border-indigo-100">
                                      <label htmlFor="weeks" className="block text-sm font-medium text-slate-700 mb-1">期間</label>
                                      <select
                                        id="weeks"
                                        className="block w-full pl-3 pr-10 py-2 text-base border-slate-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md border bg-white"
                                        value={recurringWeeks}
                                        onChange={(e) => setRecurringWeeks(parseInt(e.target.value))}
                                      >
                                        <option value={2}>2週間</option>
                                        <option value={4}>4週間 (約1ヶ月)</option>
                                        <option value={8}>8週間</option>
                                        <option value={12}>12週間 (約1学期)</option>
                                      </select>
                                    </div>
                                  )}
                                </div>
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                      <div className="bg-slate-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse border-t border-slate-200">
                        {!existingRes && (
                          <button
                            type="button"
                            className="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 sm:ml-3 sm:w-auto sm:text-sm disabled:opacity-50"
                            onClick={handleCreateReservation}
                            disabled={isSubmitting || !purpose.trim() || !reserverName.trim()}
                          >
                            {isSubmitting ? '保存中...' : '予約を確定する'}
                          </button>
                        )}
                        <button
                          type="button"
                          className="mt-3 w-full inline-flex justify-center rounded-md border border-slate-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-slate-700 hover:bg-slate-50 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm"
                          onClick={closeModal}
                          disabled={isSubmitting}
                        >
                          {existingRes ? '閉じる' : 'キャンセル'}
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<ReservationApp />);
    </script>
</body>
</html>
